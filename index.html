<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>personaX 管理后台</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Outfit", sans-serif;
      background: #f5f0ff;
      color: #2d2940;
      min-height: 100vh;
    }

    /* 登录页 */
    #loginPage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      width: min(90vw, 360px);
      box-shadow: 0 8px 32px rgba(100, 80, 160, 0.12);
      text-align: center;
    }
    .login-box h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }
    .login-box p { color: #8f86a4; font-size: 0.88rem; margin-bottom: 28px; }
    .login-box input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 999px;
      border: 1.5px solid #e0d8f0;
      font-size: 0.95rem;
      font-family: "Outfit", sans-serif;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 0.1em;
    }
    .login-box input:focus { border-color: #fa55aa; }
    .login-box button {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(180deg, #fa55aa, #ff44cd);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      font-family: "Outfit", sans-serif;
    }
    .login-error { color: #ff44cd; font-size: 0.85rem; margin-top: 10px; display: none; }

    /* 主页面 */
    #mainPage { display: none; padding: 32px 20px; max-width: 720px; margin: 0 auto; }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 28px;
    }
    .page-header h1 { font-size: 1.5rem; font-weight: 800; }
    .page-header p { color: #8f86a4; font-size: 0.85rem; margin-top: 4px; }
    .logout-btn {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1.5px solid #e0d8f0;
      background: #fff;
      color: #8f86a4;
      font-size: 0.85rem;
      font-family: "Outfit", sans-serif;
      cursor: pointer;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(100, 80, 160, 0.08);
    }
    .card h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 16px; color: #5a526e; }

    .input-row { display: flex; gap: 10px; }
    input[type="text"] {
      flex: 1;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1.5px solid #e0d8f0;
      font-size: 0.95rem;
      font-family: "Outfit", sans-serif;
      outline: none;
    }
    input[type="text"]:focus { border-color: #fa55aa; }
    .btn-primary {
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(180deg, #fa55aa, #ff44cd);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: "Outfit", sans-serif;
      white-space: nowrap;
    }

    /* 链接列表 */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .btn-ghost {
      padding: 7px 16px;
      border-radius: 999px;
      border: 1.5px solid #e0d8f0;
      background: #fff;
      color: #8f86a4;
      font-size: 0.8rem;
      font-family: "Outfit", sans-serif;
      cursor: pointer;
    }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 0.75rem;
      color: #8f86a4;
      padding: 0 12px 12px 0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    th:last-child { text-align: right; padding-right: 0; }
    td {
      padding: 12px 12px 12px 0;
      border-top: 1px solid #f0eaff;
      font-size: 0.9rem;
      vertical-align: middle;
    }
    td:last-child { text-align: right; padding-right: 0; }
    .ref-name { font-weight: 700; display: block; margin-bottom: 3px; }
    .ref-url {
      font-size: 0.78rem;
      color: #8f86a4;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ref-url a { color: #fa55aa; text-decoration: none; word-break: break-all; }
    .copy-icon {
      cursor: pointer;
      opacity: 0.5;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .copy-icon:hover { opacity: 1; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fa55aa, #ff44cd);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .badge.zero {
      background: #f0eaff;
      color: #8f86a4;
    }
    .loading { color: #8f86a4; font-size: 0.9rem; padding: 20px 0; }
    .empty { color: #8f86a4; font-size: 0.9rem; padding: 24px 0; text-align: center; }
  </style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage">
  <div class="login-box">
    <h1>personaX</h1>
    <p>请输入管理密码</p>
    <input type="password" id="pwInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()" />
    <button onclick="login()">进入后台</button>
    <p class="login-error" id="loginError">密码错误，请重试</p>
  </div>
</div>

<!-- 主页面 -->
<div id="mainPage">
  <div class="page-header">
    <div>
      <h1>下载链接管理</h1>
      <p>生成分发链接 · 查看各渠道点击数据</p>
    </div>
    <button class="logout-btn" onclick="logout()">退出</button>
  </div>

  <!-- 生成链接 -->
  <div class="card">
    <h2>新增分发链接</h2>
    <div class="input-row">
      <input type="text" id="refInput" placeholder="输入名字，例如：Min" maxlength="30"
        onkeydown="if(event.key==='Enter')createRef()" />
      <button class="btn-primary" onclick="createRef()">生成链接</button>
    </div>
  </div>

  <!-- 链接列表 -->
  <div class="card">
    <div class="list-header">
      <h2>所有链接</h2>
      <button class="btn-ghost" onclick="loadData()">刷新</button>
    </div>
    <div id="listContainer"><p class="loading">加载中…</p></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://otooejlgiviktlwaravv.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90b29lamxnaXZpa3Rsd2FyYXZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NDY2OTUsImV4cCI6MjA5MzAyMjY5NX0.ZI0rjBKnKbPOSoFrqr93psDiw6n6AwUAeaWqqnCthSg";
  const PASSWORD = "personaX";
  const BASE_URL = window.location.origin + "/download.html";

  function login() {
    const pw = document.getElementById("pwInput").value;
    if (pw === PASSWORD) {
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("mainPage").style.display = "block";
      loadData();
    } else {
      document.getElementById("loginError").style.display = "block";
    }
  }

  function logout() {
    document.getElementById("loginPage").style.display = "flex";
    document.getElementById("mainPage").style.display = "none";
    document.getElementById("pwInput").value = "";
  }

  async function createRef() {
    const name = document.getElementById("refInput").value.trim();
    if (!name) return;

    const res = await fetch(`${SUPABASE_URL}/rest/v1/refs`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "resolution=ignore-duplicates"
      },
      body: JSON.stringify({ name })
    });

    document.getElementById("refInput").value = "";
    loadData();
  }

  async function loadData() {
    document.getElementById("listContainer").innerHTML = '<p class="loading">加载中…</p>';

    const [refsRes, clicksRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/refs?select=name,created_at&order=created_at.desc`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      }),
      fetch(`${SUPABASE_URL}/rest/v1/clicks?select=ref`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      })
    ]);

    const refs = await refsRes.json();
    const clicks = await clicksRes.json();

    // 统计每个 ref 的点击数
    const clickMap = {};
    clicks.forEach(c => { clickMap[c.ref] = (clickMap[c.ref] || 0) + 1; });

    if (!refs.length) {
      document.getElementById("listContainer").innerHTML = '<p class="empty">暂无链接，先生成一个吧</p>';
      return;
    }

    let html = `<table>
      <thead><tr>
        <th>名称 / 链接</th>
        <th style="text-align:right">点击数</th>
      </tr></thead><tbody>`;

    refs.forEach(r => {
      const url = `${BASE_URL}?ref=${encodeURIComponent(r.name)}`;
      const count = clickMap[r.name] || 0;
      html += `<tr>
        <td>
          <span class="ref-name">${r.name}</span>
          <div class="ref-url">
            <a href="${url}" target="_blank">${url}</a>
            <svg class="copy-icon" onclick="copyUrl('${url}', this)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </div>
        </td>
        <td><span class="badge ${count === 0 ? 'zero' : ''}">${count}</span></td>
      </tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById("listContainer").innerHTML = html;
  }

  function copyUrl(url, el) {
    navigator.clipboard.writeText(url);
    el.style.opacity = "1";
    setTimeout(() => el.style.opacity = "0.5", 1000);
  }
</script>
</body>
</html>
